<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player | CodeAlpha Internship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><span class="orb o1"></span><span class="orb o2"></span><span class="orb o3"></span></div>

  <!-- Header -->
  <header class="header">
    <svg class="logo" viewBox="0 0 24 24" width="44" height="44" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#60a5fa"/></linearGradient></defs><path d="M4 15v-3a8 8 0 0116 0v3" fill="none" stroke="url(#g)" stroke-width="2" stroke-linecap="round"/><rect x="3" y="14" width="4" height="7" rx="2" fill="url(#g)"/><rect x="17" y="14" width="4" height="7" rx="2" fill="url(#g)"/></svg>
    <h1>MUSIC <span>PLAYER</span></h1>
    <p>Your sound. Your mood. Your moment.</p>
    <i class="line"></i>
  </header>

  <!-- Music Player -->

<main class="player-card">

  <section class="player" aria-label="Now playing">

    <div class="top">

      <!-- Album Artwork -->
      <div class="art-wrap">
        <div class="vinyl" id="vinyl" aria-hidden="true"></div>

        <img
          id="cover"
          class="cover"
          src=""
          alt="Album artwork"
        >
      </div>

      <!-- Song Information -->
      <div class="info">

        <span class="badge">Now Playing</span>

        <h2 id="title">Song title</h2>

        <p id="artist" class="artist">Artist</p>

        <p id="album" class="album">Album</p>

        <!-- Visualizer -->
        <div class="viz" id="viz" aria-hidden="true">
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
          <i></i>
        </div>

        <!-- Progress -->
        <div class="progress">

          <input
            type="range"
            id="seek"
            min="0"
            max="100"
            step="0.1"
            value="0"
            aria-label="Seek"
          >

          <div class="times">
            <span id="current">00:00</span>
            <span id="duration">00:00</span>
          </div>

        </div>

      </div>

    </div>


    <!-- Player Controls -->
    <div class="controls">

      <!-- Previous -->
      <button
        class="btn"
        id="prev"
        type="button"
        aria-label="Previous song"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6h2v12H6zM20 6v12L9.5 12z"/>
        </svg>
      </button>


      <!-- Play / Pause -->
      <button
        class="btn play"
        id="play"
        type="button"
        aria-label="Play"
      >

        <!-- ONLY ONE ICON -->
        <svg
          id="play-icon"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path id="play-path" d="M8 5v14l11-7z"/>
        </svg>

      </button>


      <!-- Next -->
      <button
        class="btn"
        id="next"
        type="button"
        aria-label="Next song"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16 6h2v12h-2zM4 6v12l10.5-6z"/>
        </svg>
      </button>

    </div>


    <!-- Volume -->
    <div class="volume">

      <button
        class="btn sm"
        id="mute"
        type="button"
        aria-label="Mute"
      >

        <svg viewBox="0 0 24 24" aria-hidden="true">

          <path d="M3 9v6h4l5 4V5L7 9z"/>

          <path
            id="wave"
            d="M15 9a4 4 0 010 6m2-9a8 8 0 010 12"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
          />

        </svg>

      </button>


      <input
        type="range"
        id="vol"
        min="0"
        max="100"
        value="70"
        aria-label="Volume"
      >

      <span id="vol-text">70%</span>

    </div>


    <!-- Status -->
    <p
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    ></p>

  </section>


  <!-- Playlist -->
  <aside
    class="playlist"
    aria-label="Playlist"
  >

    <div class="pl-head">
      <h3>Playlist</h3>
      <span id="count">6 Songs</span>
    </div>

    <ul id="list"></ul>

  </aside>

</main>


<!-- Footer -->
<footer class="footer">

  <p>
    Designed &amp; Developed by
    <b>Bisma Naz</b>
    • CodeAlpha Internship
  </p>

</footer>


<!-- Audio -->
<audio id="audioPlayer"></audio>


<script src="script.js"></script>

</body>
</html>
